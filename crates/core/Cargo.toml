[package]
name = "sheetshift-core"
version = "0.1.0"
edition = "2021"
description = "Local document-to-Excel conversion and persistence for SheetShift"
license = "MIT"

[dependencies]
anyhow = "1"
calamine = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
directories = "6"
pdf-extract = "0.10"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
